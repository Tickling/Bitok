name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contracts:
    name: API-контракты и схемы событий
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install openapi-spec-validator jsonschema pyyaml
      - name: Validate OpenAPI
        run: |
          python - <<'PY'
          import glob, yaml
          from openapi_spec_validator import validate
          for f in sorted(glob.glob("backend/api-contracts/openapi/*.yaml")):
              validate(yaml.safe_load(open(f))); print("valid", f)
          PY
      - name: Validate event schemas
        run: |
          python - <<'PY'
          import glob, json
          from jsonschema import Draft202012Validator
          for f in sorted(glob.glob("backend/api-contracts/events/*.json")):
              Draft202012Validator.check_schema(json.load(open(f))); print("valid", f)
          PY

  backend:
    name: Backend (TypeScript)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  messaging:
    name: Messaging (Go)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend/services/messaging } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  ios-packages:
    name: iOS Swift Packages
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test packages
        working-directory: ios
        run: |
          set -e
          for p in CoreDomain CoreNetwork BookingKit ProgressKit AchievementKit ChatKit ShopKit; do
            echo "::group::$p"
            swift test --package-path Packages/$p
            echo "::endgroup::"
          done

  ios-app:
    name: iOS App build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -project Bitok.xcodeproj -scheme Bitok \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

  ios-ipa:
    name: iOS IPA для установки (Sideloadly / AltStore)
    runs-on: macos-15
    needs: ios-app
    permissions:
      contents: write   # публикация свежего Bitok.ipa в служебную ветку ipa-builds
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Build unsigned IPA
        working-directory: ios
        run: |
          set -e
          xcodegen generate
          xcodebuild -project Bitok.xcodeproj -scheme Bitok -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          # Иконка должна попасть в сборку: каталог ассетов скомпилирован и иконка прописана в Info.plist
          test -f Payload/*.app/Assets.car
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon" Payload/*.app/Info.plist
          zip -qry Bitok.ipa Payload
          ls -la Bitok.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Bitok-ipa
          path: ios/Bitok.ipa
          retention-days: 30
      - name: Publish latest IPA to branch ipa-builds
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/ipa" && cp ios/Bitok.ipa "$RUNNER_TEMP/ipa/"
          cd "$RUNNER_TEMP/ipa"
          echo "Сборка ${GITHUB_SHA}, $(date -u +%Y-%m-%dT%H:%MZ)" > BUILD.txt
          git init -q -b ipa-builds
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q --allow-empty -m "Bitok.ipa from ${GITHUB_SHA}"
          git add Bitok.ipa BUILD.txt
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q --amend -m "Bitok.ipa from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ipa-builds

  ios-screenshots:
    name: iOS скриншоты для «Помощи»
    runs-on: macos-15
    needs: ios-app
    permissions:
      contents: write   # публикация PNG в служебную ветку screenshots
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Build for simulator
        working-directory: ios
        run: |
          set -e
          xcodegen generate
          xcodebuild -project Bitok.xcodeproj -scheme Bitok -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
      - name: Take screenshots
        run: ios/scripts/screenshots.sh ios/build/Build/Products/Debug-iphonesimulator/Bitok.app shots/ios
      - uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: shots/ios
          retention-days: 14
      - name: Publish screenshots to branch screenshots-ios
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd shots/ios
          git init -q -b screenshots-ios
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "iOS screenshots from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots-ios

  android:
    name: Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write   # публикация свежего Bitok.apk в служебную ветку apk-builds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Bitok.apk
          ls -la Bitok.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Bitok-apk
          path: Bitok.apk
          retention-days: 30
      - name: Publish latest APK to branch apk-builds
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/apk" && cp Bitok.apk "$RUNNER_TEMP/apk/"
          cd "$RUNNER_TEMP/apk"
          echo "Сборка ${GITHUB_SHA}, $(date -u +%Y-%m-%dT%H:%MZ)" > BUILD.txt
          git init -q -b apk-builds
          git add Bitok.apk BUILD.txt
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Bitok.apk from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-builds
